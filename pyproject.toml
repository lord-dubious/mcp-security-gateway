[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-security-gateway"
version = "0.1.0"
description = "Local-first MCP security gateway for policy-checking tool calls, risk scoring, approvals, and audit trails."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["fastapi>=0.110.0", "pydantic>=2.6.0", "uvicorn[standard]>=0.27.0"]

[project.optional-dependencies]
dev = ["httpx>=0.27.0", "pytest>=8.0.0", "pytest-cov>=4.1.0", "ruff>=0.4.0"]

[project.scripts]
mcp-security-gateway = "mcp_security_gateway.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_security_gateway"]
artifacts = ["src/mcp_security_gateway/web_assets/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
